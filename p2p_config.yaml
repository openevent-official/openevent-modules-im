version: v1

worker:
  principal: 90001
  token: tok-syncer-90001
  shutdown_timeout_ms: 10000

openevent:
  target: 127.0.0.1:9527

retry:
  publish_max_attempts: 5
  publish_retry_delay_ms: 200
  provider_send_max_attempts: 5
  provider_send_retry_delay_ms: 1000
  idle_sleep_ms: 200

logging:
  level: INFO

principal_tokens:
  - principal: 10001
    token: tok-user-10001
  - principal: 90002
    token: tok-bot-90002

providers:
  - name: lark
    sync:
      history_retry_delay_ms: 1000
      history_overlap_ms: 300000
      history_lookback_ms: 300000
      page_size: 50
      event_queue_size: 1000
    credentials:
      app_id: cli_xxx
      app_secret: app-secret-xxx
    options:
      api_base_url: https://open.larksuite.com
      timeout_seconds: 10
      event_connect_timeout_seconds: 30
      event_reconnect_timeout_seconds: 300

mappings:
  - provider: lark
    identity_type: user
    external_user_id: ou_source
    principal: 10001
    session_id: oc_p2p_10001_bot
    channel_id: 10001
  - provider: lark
    identity_type: bot
    external_user_id: cli_xxx
    principal: 90002
    session_id: oc_p2p_10001_bot
    channel_id: 10001
